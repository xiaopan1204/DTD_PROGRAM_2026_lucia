name: Run Tests

# Trigger: run automatically whenever new code is pushed to any branch,
# and also on pull requests targeting main (so you catch regressions
# before they're merged, not just after).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  # Lets you also trigger it manually from the GitHub Actions tab as proof.
  workflow_dispatch:

jobs:
  test:
    name: Install dependencies & run tests
    runs-on: ubuntu-latest

    steps:
      # 1) git push -> checkout the code that was just pushed
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 2) install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 3) run tests -> PASS / FAIL
      #    If any test fails, pytest exits non-zero and GitHub Actions
      #    marks this step (and the whole workflow run) as FAILED.
      #    If all tests pass, it exits 0 and the run is marked PASSED.
      - name: Run tests
        run: pytest tests/ -v
